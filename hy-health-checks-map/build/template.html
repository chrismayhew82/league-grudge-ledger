<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Health Checks 2026</title>
<style>
@font-face{font-family:'HYArial';src:url(data:font/woff2;base64,__ARIMO400__) format('woff2');font-weight:400}
@font-face{font-family:'HYArial';src:url(data:font/woff2;base64,__ARIMO700__) format('woff2');font-weight:700}
:root{--yellow:#FAAF3F;--grey:#898B8E;--black:#000;--bg:#fff;--land:#E9EAEA;--land2:#F4F4F4;--ytint:#FEF1DC;}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Arial,'HYArial',Helvetica,sans-serif;color:var(--black)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fff;overflow:hidden}
svg{position:absolute;left:0;top:0}
.u{text-transform:uppercase;letter-spacing:.02em}
#controls{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(255,255,255,.92);border-top:1px solid #ddd;font-size:14px}
#controls button{font:700 13px Arial,sans-serif;text-transform:uppercase;border:0;background:var(--yellow);padding:8px 14px;cursor:pointer}
#controls input{flex:1;accent-color:var(--yellow)}
body.render #controls{display:none}
.hit{cursor:pointer}
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><rect x="12" y="12" width="3" height="3" fill="#898B8E" opacity=".22"/></pattern>
    <pattern id="ydots" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="9" y="9" width="4" height="4" fill="#FAAF3F" opacity=".55"/></pattern>
    <clipPath id="ausclip"><path id="ausclipPath"/></clipPath>
    <clipPath id="photoclip"><rect x="0" y="0" width="560" height="315"/></clipPath>
    <linearGradient id="fadeL" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".97"/><stop offset=".72" stop-color="#fff" stop-opacity=".93"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="bw"><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#dots)" id="oceanDots"/>
  <g id="cam">
    <path id="others" fill="#F3F3F3" stroke="#D9DADB" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path id="aus" fill="#E6E7E8" stroke="#898B8E" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <path id="borders" fill="none" stroke="#fff" stroke-width="2.5" vector-effect="non-scaling-stroke" clip-path="url(#ausclip)"/>
  </g>
  <g id="route"></g>
  <g id="markers"></g>
  <g id="leader"></g>
  <!-- left panel -->
  <rect id="panelBg" x="0" y="0" width="900" height="1080" fill="url(#fadeL)" opacity="0"/>
  <g id="benefits"></g>
  <g id="header"></g>
  <g id="card"></g>
  <g id="progress"></g>
  <g id="finale"></g>
  <g id="intro"></g>
</svg>
</div>
<div id="controls"><button id="play">Pause</button><button id="replay">Replay</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="time">0.0s</span></div>
<script>__DATA__</script>
<script>
const LOGO='data:image/png;base64,__LOGO__';
const PHOTOS=__PHOTOS__;
const CREDITS={cairns:'Image: Hansen Yuncken',uq:'Render: Hansen Yuncken',uon:'Render: Hansen Yuncken',liverpool:'Render: Hansen Yuncken',
  medowie:'Artist impression: NSW Government',cessnock:'Concept: Health Infrastructure NSW',warrnambool:'Render: The Standard / VHBA',
  firmus:'Image: Firmus',anipdf:'Image: Australian Naval Infrastructure',anistack:'Image: Australian Naval Infrastructure'};
const W=1920,H=1080, NS='http://www.w3.org/2000/svg';
const G=window.GEO, P=G.P, N=P.length;
const $=id=>document.getElementById(id);
$('aus').setAttribute('d',G.aus); $('ausclipPath').setAttribute('d',G.aus);
$('others').setAttribute('d',G.others); $('borders').setAttribute('d',G.borders);

// ---------- helpers
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const back=t=>{const c=1.9;t=t-1;return 1+(c+1)*t*t*t+c*t*t;};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;}
function clear(g){while(g.firstChild)g.removeChild(g.firstChild);}
function wrap(text,max){const w=text.split(' ');const lines=[];let cur='';for(const x of w){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x;}else cur=(cur+' '+x).trim();}if(cur)lines.push(cur);return lines;}

// ---------- timeline
const T_INTRO=2.6, BEN=5.6, DWELL=1.65, T_FIN=4.8;
const S0=T_INTRO+BEN;
const FX=1290, FY=560;
const CAMZ={cairns:3.0,uq:3.2,medowie:13,uon:13,cessnock:13,liverpool:7,firmus:4.2,warrnambool:4.2,anipdf:28,anistack:28};
const cl=(ids)=>{const s=ids.map(i=>P.find(p=>p.id===i));return[s.reduce((a,p)=>a+p.x,0)/s.length,s.reduce((a,p)=>a+p.y,0)/s.length];};
const NEWC=cl(['medowie','uon','cessnock']), ADL=cl(['anipdf','anistack']);
const FOCUS={medowie:NEWC,uon:NEWC,cessnock:NEWC,anipdf:ADL,anistack:ADL};
const cams=P.map(p=>{const f=FOCUS[p.id]||[p.x,p.y];return{cx:f[0],cy:f[1],z:CAMZ[p.id],fx:FX,fy:FY};});
const OV={cx:W/2,cy:H/2,z:1,fx:W/2,fy:H/2};
const OVB={cx:W/2+40,cy:H/2,z:0.86,fx:W/2+185,fy:H/2}; // slow push-in during benefits
// finale: frame QLD, NSW, VIC, TAS, SA (eastern states) to the right of the list panel
const EB=G.EB, RX0=700, RX1=1890, RY0=8, RY1=1072;
const ebw=EB[1][0]-EB[0][0], ebh=EB[1][1]-EB[0][1];
const OVF={cx:(EB[0][0]+EB[1][0])/2,cy:(EB[0][1]+EB[1][1])/2,z:Math.min((RX1-RX0)/ebw,(RY1-RY0)/ebh),fx:(RX0+RX1)/2,fy:(RY0+RY1)/2};
// smooth zoom-and-pan path (van Wijk & Nuij, same maths as d3.interpolateZoom)
const RHO=1.25;
function zoomPath(a,b){
  const rho2=RHO*RHO,rho4=rho2*rho2,w0=W/a.z,w1=W/b.z,dx=b.cx-a.cx,dy=b.cy-a.cy,d2=dx*dx+dy*dy;let S,f;
  if(d2<1e-9){S=Math.log(w1/w0)/RHO;f=t=>[a.cx+t*dx,a.cy+t*dy,w0*Math.exp(RHO*t*S)];}
  else{const d1=Math.sqrt(d2),b0=(w1*w1-w0*w0+rho4*d2)/(2*w0*rho2*d1),b1=(w1*w1-w0*w0-rho4*d2)/(2*w1*rho2*d1),r0=Math.log(Math.sqrt(b0*b0+1)-b0),r1=Math.log(Math.sqrt(b1*b1+1)-b1);S=(r1-r0)/RHO;
    f=t=>{const s=t*S,ch=Math.cosh(r0),u=w0/(rho2*d1)*(ch*Math.tanh(RHO*s+r0)-Math.sinh(r0));return[a.cx+u*dx,a.cy+u*dy,w0*ch/Math.cosh(RHO*s+r0)];};}
  return{f,S:Math.abs(S)};
}
const esine=t=>-(Math.cos(Math.PI*t)-1)/2;
function flight(a,b){const zp=zoomPath(a,b);
  // duration grows with path length: short hops ~1.6s, long hops up to ~4.4s
  const dur=zp.S<0.05?0.6:clamp(1.3+zp.S*0.7,1.5,2.4);
  return{dur,at:t=>{const e=esine(clamp(t));const[cx,cy,w]=zp.f(e);return{cx,cy,z:W/w,fx:lerp(a.fx,b.fx,e),fy:lerp(a.fy,b.fy,e)};}};}
const FL=[],ST=[];let acc=S0;
for(let i=0;i<N;i++){const fl=flight(i===0?OVB:cams[i-1],cams[i]);FL.push(fl);ST.push(acc);acc+=fl.dur+DWELL;}
const FIN=flight(cams[N-1],OVF); FIN.dur=clamp(FIN.dur,2.0,2.4);
const TEND=acc, TOTAL=TEND+T_FIN;
function stopAt(t){if(t<S0)return{i:-1};for(let i=N-1;i>=0;i--)if(t>=ST[i])return t<ST[i]+FL[i].dur+DWELL?{i,e:t-ST[i],F:FL[i].dur}:{i:N};return{i:-1};}
function camera(t){
  if(t<S0){const k=esine(seg(t,T_INTRO-0.2,T_INTRO+1.4));return{cx:lerp(OV.cx,OVB.cx,k),cy:OV.cy,z:lerp(1,OVB.z,k),fx:lerp(OV.fx,OVB.fx,k),fy:OV.fy};}
  const s=stopAt(t);
  if(s.i<N) return FL[s.i].at(s.e/s.F);
  return FIN.at((t-TEND)/FIN.dur);
}
function toScreen(c,x,y){return[(x-c.cx)*c.z+(c.fx??FX),(y-c.cy)*c.z+(c.fy??FY)];}

// ---------- icons (line drawings, 0..120 box)
function icon(kind,g){
  const s={fill:'none',stroke:'#000','stroke-width':4,'stroke-linejoin':'round','stroke-linecap':'square'};
  const add=(tag,a)=>el(tag,Object.assign({},s,a),g);
  if(kind==='health'){add('rect',{x:14,y:30,width:92,height:76});add('rect',{x:44,y:10,width:32,height:20});
    el('path',{d:'M52 46h16v14h14v16H68v14H52V76H38V60h14z',fill:'#FAAF3F',stroke:'#000','stroke-width':4,'stroke-linejoin':'round'},g);}
  if(kind==='sport'){add('ellipse',{cx:60,cy:66,rx:48,ry:30});add('ellipse',{cx:60,cy:66,rx:28,ry:14});add('path',{d:'M12 66h20M88 66h20'});
    el('rect',{x:52,y:14,width:16,height:16,fill:'#FAAF3F',stroke:'#000','stroke-width':4},g);add('path',{d:'M60 30v20'});}
  if(kind==='school'){add('path',{d:'M10 50L60 22l50 28'});add('rect',{x:18,y:50,width:84,height:56});add('rect',{x:50,y:78,width:20,height:28});
    add('path',{d:'M60 22V6'});el('rect',{x:60,y:6,width:18,height:11,fill:'#FAAF3F',stroke:'#000','stroke-width':3},g);
    add('rect',{x:28,y:62,width:12,height:12});add('rect',{x:80,y:62,width:12,height:12});}
  if(kind==='living'){add('rect',{x:30,y:10,width:60,height:98});for(let r=0;r<5;r++)for(let c=0;c<3;c++){el('rect',{x:40+c*15,y:20+r*16,width:9,height:9,fill:(r+c)%3===0?'#FAAF3F':'#000'},g);}add('path',{d:'M14 108h92'});}
  if(kind==='data'){for(let r=0;r<3;r++){add('rect',{x:20,y:14+r*32,width:80,height:26});el('rect',{x:30,y:24+r*32,width:8,height:6,fill:'#FAAF3F'},g);add('path',{d:`M50 ${27+r*32}h40`});}}
  if(kind==='naval'){add('path',{d:'M10 76c0-12 14-18 30-18h50c12 0 20 8 20 18s-8 18-20 18H40c-16 0-30-6-30-18z'});
    add('path',{d:'M52 58V38h22v20'});add('path',{d:'M62 38V24'});el('rect',{x:24,y:72,width:8,height:8,fill:'#FAAF3F'},g);
    el('rect',{x:44,y:72,width:8,height:8,fill:'#FAAF3F'},g);el('rect',{x:64,y:72,width:8,height:8,fill:'#FAAF3F'},g);add('path',{d:'M4 104c14-6 24-6 38 0s24 6 38 0 24-6 38 0'});}
}

// ---------- static header
const PX=96;
function buildHeader(){const g=$('header');clear(g);
  el('image',{href:LOGO,x:PX,y:70,width:300,height:300*153/1034},g);
  el('text',{x:PX,y:150,'font-size':30,'font-weight':700,class:'u'},g,'Project Health Checks 2026');
  el('rect',{x:PX,y:168,width:56,height:6,fill:'#FAAF3F'},g);
}

// ---------- card
let cardCache={};
function buildCard(i){
  const p=P[i];const g=el('g',{});
  // counter
  el('text',{x:0,y:0,'font-size':92,'font-weight':700,fill:'#FAAF3F'},g,String(i+1).padStart(2,'0'));
  el('text',{x:118,y:0,'font-size':34,'font-weight':700,fill:'#898B8E'},g,'/ '+String(N).padStart(2,'0'));
  // photo frame
  const ph=el('g',{transform:'translate(0,34)'},g);
  el('rect',{x:0,y:0,width:560,height:315,fill:'#FEF1DC'},ph);
  if(PHOTOS[p.id]){
    const pg=el('g',{'clip-path':'url(#photoclip)'},ph);
    el('image',{href:PHOTOS[p.id],x:0,y:0,width:560,height:315,preserveAspectRatio:'xMidYMid slice'},pg);
    const cr=CREDITS[p.id]; if(cr){const cw=cr.length*6.3+16;
      el('rect',{x:560-cw,y:293,width:cw,height:22,fill:'#000',opacity:.6},pg);
      el('text',{x:552,y:308,'text-anchor':'end','font-size':12,fill:'#fff'},pg,cr);}
  }else{
    el('rect',{x:0,y:0,width:560,height:315,fill:'url(#ydots)'},ph);
    el('rect',{x:190,y:68,width:180,height:180,fill:'#fff'},ph);
    const ig=el('g',{transform:'translate(220,98) scale(1)'},ph);icon(p.icon,ig);
  }
  el('rect',{x:0,y:0,width:560,height:315,fill:'none',stroke:'#000','stroke-width':2},ph);
  // sector tag
  const tagW=p.sector.length*13.5+36;
  el('rect',{x:0,y:374,width:tagW,height:38,fill:'#000'},g);
  el('text',{x:18,y:400,'font-size':19,'font-weight':700,fill:'#FAAF3F',class:'u'},g,p.sector);
  // name
  const lines=wrap(p.name.toUpperCase(),26);
  lines.forEach((l,k)=>el('text',{x:0,y:466+k*48,'font-size':42,'font-weight':700},g,l));
  const y2=466+(lines.length-1)*48;
  el('text',{x:0,y:y2+52,'font-size':27,fill:'#000'},g,p.city+'  ·  '+p.state);
  el('text',{x:0,y:y2+90,'font-size':21,fill:'#898B8E'},g,'Client: '+p.client);
  return g;
}

// ---------- intro
function drawIntro(t){t=t*3.4/T_INTRO;const TI=3.4;const g=$('intro');clear(g);
  if(t>TI+0.7) return;
  const out=seg(t,TI-0.2,TI+0.7);
  const a=1-eout(out);
  el('rect',{x:0,y:0,width:W,height:H,fill:'#fff',opacity:a},g);
  el('rect',{x:0,y:0,width:W,height:H,fill:'url(#dots)',opacity:a},g);
  // yellow block sweep
  const sw=eout(seg(t,0.1,0.9));
  el('rect',{x:0,y:H-20,width:W*sw,height:20,fill:'#FAAF3F',opacity:a},g);
  const lg=eout(seg(t,0.3,1.1));
  el('image',{href:LOGO,x:W/2-330,y:330-30*(1-lg),width:660,height:660*153/1034,opacity:lg*a},g);
  const t1=eout(seg(t,0.8,1.6));
  el('text',{x:W/2,y:540+20*(1-t1),'text-anchor':'middle','font-size':86,'font-weight':700,class:'u',opacity:t1*a},g,'Project Health Checks');
  const t2=eout(seg(t,1.2,2.0));
  el('text',{x:W/2,y:620+20*(1-t2),'text-anchor':'middle','font-size':40,fill:'#898B8E','font-weight':700,class:'u',opacity:t2*a,'letter-spacing':'.3em'},g,'2026 in review');
  // stat squares
  const t3=seg(t,1.7,2.7);
  const stats=[['10','Projects'],['5','States'],['6','Sectors']];
  stats.forEach((s,k)=>{const lt=eout(clamp(t3*3-k));const x=W/2-330+k*240;
    el('rect',{x:x,y:690,width:180,height:180*lt,fill:k===0?'#FAAF3F':'#fff',stroke:'#000','stroke-width':2,opacity:a*lt},g);
    el('text',{x:x+90,y:790,'text-anchor':'middle','font-size':72,'font-weight':700,opacity:a*lt},g,s[0]);
    el('text',{x:x+90,y:840,'text-anchor':'middle','font-size':20,'font-weight':700,class:'u',opacity:a*lt},g,s[1]);
  });
}


// black circle with white 'HY' (location marker)
function hyMark(g,x,y,r,j){if(r<=0.3)return;
  el('circle',{cx:x,cy:y,r:r,fill:'#000',stroke:'#fff','stroke-width':Math.max(1.5,r*0.1),class:'hit','data-i':j},g);
  el('text',{x:x,y:y+r*0.29,'text-anchor':'middle','font-size':r*0.82,'font-weight':700,fill:'#fff','letter-spacing':'-.02em','pointer-events':'none'},g,'HY');
}
// benefits screen over the map
const BENEFITS=[
 ['Earlier Risk & Opportunity Insight','Issues surfaced early, upside captured'],
 ['Independent Strategic Support','Senior, objective eyes on delivery'],
 ['Financial & Contractual Confidence','Commercial and legal positions tested'],
 ['Programme Certainty','A clear, credible path to completion'],
 ['Shared Lessons, Stronger Delivery','Insights carried across our national portfolio'],
];
function drawBenefits(t){const g=$('benefits');clear(g);
  const b=t-T_INTRO; if(b<0||t>S0+0.1) return;
  const out=1-eout(seg(t,S0-0.7,S0-0.1));
  const ta=eout(seg(b,0.2,0.8))*out;
  el('image',{href:LOGO,x:PX,y:150,width:240,height:240*153/1034,opacity:ta},g);
  el('text',{x:PX,y:250,'font-size':46,'font-weight':700,class:'u',opacity:ta},g,'Why Project Health Checks');
  el('rect',{x:PX,y:272,width:56*ta,height:6,fill:'#FAAF3F',opacity:ta},g);
  BENEFITS.forEach((it,k)=>{const a=eout(seg(b,0.7+k*0.5,1.3+k*0.5))*out;if(a<=0)return;
    const y=340+k*118, dx=24*(1-a);
    el('rect',{x:PX+dx,y:y,width:64,height:64,fill:'#FAAF3F',opacity:a},g);
    el('text',{x:PX+32+dx,y:y+44,'text-anchor':'middle','font-size':30,'font-weight':700,opacity:a},g,String(k+1).padStart(2,'0'));
    el('text',{x:PX+90+dx,y:y+28,'font-size':31,'font-weight':700,class:'u',opacity:a},g,it[0]);
    el('text',{x:PX+90+dx,y:y+60,'font-size':22,fill:'#6E7073',opacity:a},g,it[1]);
  });
}

// ---------- per-frame render
function render(t){
  const c=camera(t);
  $('cam').setAttribute('transform',`translate(${c.fx??FX},${c.fy??FY}) scale(${c.z}) translate(${-c.cx},${-c.cy})`);
  // map reveal
  const mr=eout(seg(t,T_INTRO-0.3,T_INTRO+1.6));
  $('aus').setAttribute('opacity',mr);$('others').setAttribute('opacity',mr);
  $('borders').setAttribute('opacity',eout(seg(t,T_INTRO+0.8,T_INTRO+2.2)));
  $('cam').setAttribute('style',`transform-box:view-box`);
  // header
  const ha=eout(seg(t,S0-0.5,S0+0.3));
  $('header').setAttribute('opacity',ha*(1-eout(seg(t,TEND+0.05,TEND+0.55))));
  // left panel soft white backing when zoomed
  $('panelBg').setAttribute('opacity',eout(seg(t,T_INTRO,T_INTRO+0.8)));
  drawBenefits(t);
  // current stop
  const st=stopAt(t); const i=st.i, e=st.e, F=st.F;
  const inTour=t>=S0&&i>=0&&i<N;
  // markers + route (screen space)
  const mg=$('markers'),rg=$('route'),lg=$('leader');clear(mg);clear(rg);clear(lg);
  const fin=t-TEND;
  const visited=t<S0?0:(inTour?i+(e>=F-0.3?1:0):N);
  // route
  for(let j=1;j<visited;j++){
    const a=toScreen(c,P[j-1].x,P[j-1].y),b=toScreen(c,P[j].x,P[j].y);
    let pr=1; if(inTour&&j===i) pr=esine(seg(e,0.15,F));
    const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    el('line',{x1:a[0],y1:a[1],x2:lerp(a[0],b[0],pr),y2:lerp(a[1],b[1],pr),stroke:'#000','stroke-width':2,'stroke-dasharray':'2 7','stroke-linecap':'square',opacity:.55},rg);
  }
  for(let j=0;j<visited;j++){
    const p=P[j];const [x,y]=toScreen(c,p.x,p.y);
    const cur=inTour&&j===i;
    let s=1; if(cur) s=back(clamp(seg(e,F-0.3,F+0.1)));
    const big=cur?1:(fin>0?0.85:0.62);
    const sz=26*big*s;
    if(cur){ // pulses
      for(let r=0;r<2;r++){const pt=((e-F-0.1)*0.7+r*0.5)%1; if(e>F-0.1){el('circle',{cx:x,cy:y,r:22+pt*48,fill:'none',stroke:'#FAAF3F','stroke-width':3,opacity:(1-pt)*0.9},mg);}}
    }
    hyMark(mg,x,y,(cur?22:(fin>0?14:12))*s,j);
  }
  // finale numbering on map
  if(fin>0){
    const fa=eout(seg(fin,1.1,1.7));
    const groups=[['cairns'],['uq'],['medowie','uon','cessnock','liverpool'],['firmus'],['warrnambool'],['anipdf','anistack']];
    const offs={cairns:[40,0],uq:[40,0],medowie:[-90,60],firmus:[40,10],warrnambool:[-40,40],anipdf:[-40,-40]};
    groups.forEach(gp=>{const p0=P.find(p=>p.id===gp[0]);const [x,y]=toScreen(c,p0.x,p0.y);const o=offs[gp[0]];
      const nums=gp.map(id=>P.findIndex(p=>p.id===id)+1).join(' · ');
      const tx=x+o[0],ty=y+o[1];
      el('line',{x1:x,y1:y,x2:tx,y2:ty,stroke:'#000','stroke-width':1.5,opacity:fa},mg);
      el('text',{x:tx+(o[0]>0?6:-6),y:ty+8,'text-anchor':o[0]>0?'start':'end','font-size':24,'font-weight':700,opacity:fa,stroke:'#fff','stroke-width':6,'paint-order':'stroke','stroke-linejoin':'round'},mg,nums);
    });
  }
  // card
  const cg=$('card');clear(cg);
  if(inTour){
    const ci=seg(e,F-0.25,F+0.3), co=seg(e,F+DWELL-0.3,F+DWELL);
    const a=eout(ci)*(1-eout(co));
    if(a>0.001){
      if(!cardCache[i])cardCache[i]=buildCard(i);
      const card=cardCache[i];
      card.setAttribute('transform',`translate(${PX-60*(1-eout(ci))+0*co},${300})`);
      card.setAttribute('opacity',a);cg.appendChild(card);
      // leader line from card to marker
      const [mx,my]=toScreen(c,P[i].x,P[i].y);
      const sx=PX+560, sy=300+34+157;
      const lp=eout(seg(e,F+0.05,F+0.45))*(1-eout(co));
      if(lp>0){const ex=lerp(sx,mx-24,lp),ey=lerp(sy,my,lp);
        el('line',{x1:sx,y1:sy,x2:ex,y2:ey,stroke:'#000','stroke-width':1.5,opacity:a},lg);
        el('rect',{x:sx-5,y:sy-5,width:10,height:10,fill:'#000',opacity:a},lg);}
    }
  }
  // progress squares
  const pg=$('progress');clear(pg);
  const pa=ha*(1-eout(seg(fin,0.3,1.0)));
  if(pa>0){for(let j=0;j<N;j++){const on=j<visited;const cur=inTour&&j===i;
    el('rect',{x:PX+j*34,y:1000,width:24,height:24,fill:on?'#FAAF3F':'#fff',stroke:cur?'#000':'#898B8E','stroke-width':cur?3:1.5,opacity:pa,class:'hit','data-i':j},pg);}}
  // finale panel
  const fg=$('finale');clear(fg);
  if(fin>0){
    const fa=eout(seg(fin,0.5,1.2));
    el('image',{href:LOGO,x:PX,y:70,width:300,height:300*153/1034,opacity:fa},fg);
    el('text',{x:PX,y:170,'font-size':44,'font-weight':700,class:'u',opacity:fa},fg,'Project Health Checks');
    el('text',{x:PX,y:214,'font-size':26,'font-weight':700,fill:'#898B8E',class:'u','letter-spacing':'.2em',opacity:fa},fg,'2026 · 10 projects · 5 states');
    el('rect',{x:PX,y:238,width:56,height:6,fill:'#FAAF3F',opacity:fa},fg);
    P.forEach((p,j)=>{const la=eout(seg(fin,0.8+j*0.08,1.2+j*0.08));const y=300+j*62;
      el('rect',{x:PX-20*(1-la),y:y,width:44,height:44,fill:'#FAAF3F',opacity:la},fg);
      el('text',{x:PX+22-20*(1-la),y:y+31,'text-anchor':'middle','font-size':22,'font-weight':700,opacity:la},fg,String(j+1).padStart(2,'0'));
      el('text',{x:PX+62-20*(1-la),y:y+22,'font-size':22,'font-weight':700,opacity:la},fg,p.name);
      el('text',{x:PX+62-20*(1-la),y:y+44,'font-size':17,fill:'#898B8E',opacity:la},fg,p.city+' · '+p.state);
    });
    const ta=eout(seg(fin,2.2,2.9));
    el('rect',{x:0,y:H-20,width:W*ta,height:20,fill:'#FAAF3F'},fg);
    el('text',{x:PX,y:H-60,'font-size':28,'font-weight':700,class:'u',opacity:ta},fg,'Driven by challenge, built with pride.');
  }
  drawIntro(t);
}

// ---------- playback
buildHeader();
window.TOTAL=TOTAL; window.renderAt=render;
function fit(){const s=Math.min(innerWidth/W,(innerHeight-(document.body.classList.contains('render')?0:52))/H);const st=$('stage');st.style.transform=`scale(${s})`;st.style.left=((innerWidth-W*s)/2)+'px';st.style.top=document.body.classList.contains('render')?'0px':Math.max(0,(innerHeight-52-H*s)/2)+'px';}
const isRender=/render=1/.test(location.search);
if(isRender){document.body.classList.add('render');}
addEventListener('resize',fit);fit();
let playing=!isRender,t0=performance.now(),tNow=0;
function setT(t){tNow=clamp(t,0,TOTAL);t0=performance.now()-tNow*1000;render(tNow);$('scrub').value=Math.round(tNow/TOTAL*1000);$('time').textContent=tNow.toFixed(1)+'s / '+TOTAL.toFixed(0)+'s';}
function loop(){if(playing){tNow=(performance.now()-t0)/1000;if(tNow>=TOTAL){tNow=TOTAL;playing=false;$('play').textContent='Play';}setT(tNow);}requestAnimationFrame(loop);}
$('play').onclick=()=>{if(!playing&&tNow>=TOTAL)setT(0);playing=!playing;t0=performance.now()-tNow*1000;$('play').textContent=playing?'Pause':'Play';};
$('replay').onclick=()=>{setT(0);playing=true;$('play').textContent='Pause';};
$('scrub').oninput=e=>{setT(e.target.value/1000*TOTAL);};
// click a marker or progress square to jump to that project
$('stage').addEventListener('click',e=>{const d=e.target.getAttribute&&e.target.getAttribute('data-i');if(d!=null){setT(ST[+d]+FL[+d].dur+0.8);playing=false;$('play').textContent='Play';}});
if(isRender) render(0); else {setT(0);requestAnimationFrame(loop);}
</script>
